name: CI

on:
  push:
  pull_request:

jobs:
  # g++ only: the real, verified floor is GCC 13+ or Clang 19+ paired with
  # -stdlib=libc++ (see README's Requirements section and docker/README.md
  # for the full, checked-not-assumed story). ubuntu-latest's default
  # `clang++` is paired with the distro's system libstdc++, not libc++ --
  # an untested, unsupported, and unclaimed pairing, not a weaker version
  # of the pairing this project actually supports. Clang itself (19-21,
  # with libc++) is already exercised correctly by the docker-matrix job
  # below; duplicating it here under a different, unsupported pairing
  # would only add a confusing, non-representative red X.
  native:
    name: native (g++, C++${{ matrix.std }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        std: [20, 23]
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_CXX_COMPILER=g++
          -DCMAKE_CXX_STANDARD=${{ matrix.std }}
          -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build -j

      - name: Test
        run: ctest --test-dir build --output-on-failure

  static-analysis:
    name: static analysis (scan-build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pinned to clang-19 + libc++-19: the one Clang/standard-library
      # pairing this project actually supports (see the native job's
      # comment above) -- scan-build is clang-based, so it needs the same
      # pairing the docker-matrix's clang-19..21 images use, not whatever
      # default "clang" the runner's distro happens to resolve to.
      - name: Install clang-19 + libc++-19
        run: >
          sudo apt-get update && sudo apt-get install -y
          clang-19 clang-tools-19 libc++-19-dev libc++abi-19-dev perl

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_CXX_COMPILER=clang++-19
          -DCMAKE_CXX_STANDARD=23
          -DCMAKE_CXX_FLAGS=-stdlib=libc++
          -DCMAKE_EXE_LINKER_FLAGS="-stdlib=libc++ -lc++abi"

      - name: Build once (populate object files so the target has something to re-scan)
        run: cmake --build build -j

      - name: Run cbor_static_analysis target
        run: cmake --build build --target cbor_static_analysis

  docker-matrix:
    name: docker (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - gcc-13
          - gcc-14
          - gcc-15
          - clang-19
          - clang-20
          - clang-21
          - esp32
          - stm32
          - riscv32
          - wasm
        # Kept building (not deleted) and intentionally allowed to fail,
        # each for its own distinct, checked reason documented in
        # docker/README.md -- this is this project's own
        # expected_failures/ convention applied to the compiler matrix
        # itself: proving where the real floor is, not silently dropping
        # the versions below it. A red X here is expected, not a CI bug;
        # a green check here would actually be the surprise worth
        # investigating.
        include:
          - target: gcc-10
            allow_failure: true
          - target: gcc-11
            allow_failure: true
          - target: gcc-12
            allow_failure: true
          - target: clang-13
            allow_failure: true
          - target: clang-14
            allow_failure: true
          - target: clang-15
            allow_failure: true
          - target: clang-16
            allow_failure: true
          - target: clang-17
            allow_failure: true
          - target: clang-18
            allow_failure: true
    steps:
      - uses: actions/checkout@v4

      - name: docker build -f docker/${{ matrix.target }}.Dockerfile
        continue-on-error: ${{ matrix.allow_failure == true }}
        run: docker build -f docker/${{ matrix.target }}.Dockerfile -t cbor-${{ matrix.target }} .

  webapp:
    name: webapp (build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Proves bridge.cpp still compiles clean against the real Emscripten
      # toolchain (same warning set as the rest of this project) and that
      # the served image actually serves index.html/app.js/dist/*. Not a
      # browser/UI test -- that's run by hand (see webapp/README.md) --
      # just the build-and-serve smoke test this directory's own
      # Dockerfile is designed to make possible.
      - name: docker build -f webapp/Dockerfile
        run: docker build -f webapp/Dockerfile -t cbor-webapp .

      - name: Run it and check every asset is served
        run: |
          docker run -d --rm -p 8080:8080 --name cbor-webapp-ci cbor-webapp
          sleep 1
          for path in / /app.js /dist/cbor.js /dist/cbor.wasm; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:8080${path}")
            echo "GET ${path} -> ${code}"
            if [ "${code}" != "200" ]; then
              echo "::error::${path} did not return 200"
              exit 1
            fi
          done
          docker stop cbor-webapp-ci
